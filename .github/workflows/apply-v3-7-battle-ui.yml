name: Apply BID GRID v3.7

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Apply v3.7 patch
        run: python3 scripts/apply_v37.py

      - name: Validate JavaScript and assets
        run: |
          test -s public/characters/characters_hd.png
          test -s public/characters/gunslinger/gunslinger_idle_1.png
          test -s public/characters/gunslinger/gunslinger_idle_2.png
          test -s public/characters/gunslinger/gunslinger_idle_3.png
          test -s public/characters/gunslinger/gunslinger_idle_4.png
          python3 -c "import re,pathlib; s=pathlib.Path('public/index.html').read_text(encoding='utf-8'); pathlib.Path('/tmp/bidgrid.js').write_text('\\n'.join(re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)),encoding='utf-8')"
          node --check /tmp/bidgrid.js

      - name: Commit v3.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-7-battle-ui.yml
          git rm scripts/apply_v37.py
          git rm -f .v3-7-trigger || true
          git add public/index.html public/characters/characters_hd.png public/characters/gunslinger/gunslinger_idle_1.png public/characters/gunslinger/gunslinger_idle_2.png public/characters/gunslinger/gunslinger_idle_3.png public/characters/gunslinger/gunslinger_idle_4.png
          git commit -m "Add BID GRID v3.7 battle arena polish"
          git push
