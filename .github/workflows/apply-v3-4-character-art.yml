name: Apply BID GRID v3.4 character art
on:
  push:
    paths:
      - '.github/workflows/apply-v3-4-character-art.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install character art
        run: |
          mkdir -p public/characters
          unzip -o .tmp/bidgrid-characters120.zip -d public/characters
      - name: Patch opening character selector
        run: python .github/scripts/patch_v3_4_character_art.py
      - name: Validate JavaScript
        run: node --check /tmp/bid-grid-v34-inline.js
      - name: Commit changes
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-v3-4-character-art.yml .github/scripts/patch_v3_4_character_art.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add BID GRID v3.4 opening character art selector"
          git push
