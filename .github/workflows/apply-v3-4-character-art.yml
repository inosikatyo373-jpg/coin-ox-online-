name: Apply BID GRID v3.4 character art
on:
  push:
    paths:
      - '.github/workflows/apply-v3-4-character-art.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install character art
        run: |
          mkdir -p public/characters
          unzip -o .tmp/bidgrid-characters120.zip -d public/characters
      - name: Patch opening character selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          s=s.replace('BID GRID ONLINE v3.3','BID GRID ONLINE v3.4')
          s=s.replace('ONLINE v3.3 / 2本先取・最大3戦','ONLINE v3.4 / 2本先取・最大3戦')

          css=r'''
/* ===== BID GRID v3.4 : OPENING CHARACTER ART ===== */
.openingCharacterSelect{
  margin:14px 0 12px;padding:14px;border:1px solid #765a2a;border-radius:16px;
  background:linear-gradient(180deg,#111a28,#090f18);box-shadow:inset 0 0 0 1px #21170b,0 10px 24px #0004;
}
.openingCharacterTitle{text-align:center;margin-bottom:3px;color:#f2d27a;font-family:"Cormorant Garamond","Times New Roman",serif;font-size:24px;font-weight:700;letter-spacing:.08em}
.openingCharacterLead{text-align:center;color:#968b73;font-size:10px;margin-bottom:10px;letter-spacing:.05em}
#openingMenu .openingCharacterGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
#openingMenu .openingCharacterGrid .characterCard{min-height:126px;padding:6px 4px!important}
#openingMenu .openingCharacterGrid .charPortrait{width:76px;height:76px;border:0;background:transparent;box-shadow:none;overflow:visible}
#openingMenu .openingCharacterGrid .charPortrait::before{display:none}
.characterPortraitImage{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 5px 5px #0008)}
#openingMenu .openingCharacterGrid .charName{font-size:11px}
#openingMenu .openingCharacterGrid .charSub{font-size:7px}
#openingSelectedCharacter{margin-top:9px;text-align:center;color:#efd079;font-size:12px;font-weight:1000;min-height:18px}
#openingMenu .openingCharacterGrid .characterCard.selected::after{
  content:"SELECTED";position:absolute;right:5px;top:5px;padding:2px 5px;border-radius:999px;
  background:#d9ad4d;color:#1b1105;font-size:7px;font-weight:1000;letter-spacing:.06em;box-shadow:0 2px 8px #0008;
}
@media(max-width:600px){
  .openingCharacterSelect{padding:9px;margin:10px 0}.openingCharacterTitle{font-size:20px}
  #openingMenu .openingCharacterGrid{gap:4px}
  #openingMenu .openingCharacterGrid .characterCard{min-height:103px;padding:4px 2px!important;border-radius:10px!important}
  #openingMenu .openingCharacterGrid .charPortrait{width:58px;height:58px}
  #openingMenu .openingCharacterGrid .charName{font-size:9px}
  #openingMenu .openingCharacterGrid .charSub{display:none}
}
'''
          if 'BID GRID v3.4 : OPENING CHARACTER ART' not in s:
              s=s.replace('\n</style></head>',css+'\n</style></head>')

          old='''function characterVisual(id,compact=false){\n  const c=id==="random"?{id:"random",name:"ランダム",sub:"RANDOM",glyph:"?"}:getCharacterDef(id);\n  return `<div class="charPortrait character-${c.id}"><span class="charGlyph">${c.glyph}</span></div><div class="charName">${c.name}</div>${compact?"":`<div class="charSub">${c.sub}</div>`}`;\n}'''
          new='''function characterVisual(id,compact=false){\n  const c=id==="random"?{id:"random",name:"ランダム",sub:"RANDOM",glyph:"?"}:getCharacterDef(id);\n  return `<div class="charPortrait character-${c.id}"><img class="characterPortraitImage" src="/characters/${c.id}.png" alt="${c.name}"></div><div class="charName">${c.name}</div>${compact?"":`<div class="charSub">${c.sub}</div>`}`;\n}'''
          if old not in s: raise SystemExit('characterVisual not found')
          s=s.replace(old,new,1)

          marker='''async function chooseCharacter(id){'''
          opening_js=r'''function renderOpeningCharacterGrid(){
  const g=$("openingCharacterGrid"); if(!g)return;
  g.innerHTML=CHARACTER_ORDER.map(id=>`<button class="characterCard ${id==="random"?"randomCard":""} ${selectedCharacter===id?"selected":""}" data-opening-character="${id}">${characterVisual(id)}</button>`).join("");
  g.querySelectorAll("[data-opening-character]").forEach(btn=>btn.onclick=()=>chooseOpeningCharacter(btn.dataset.openingCharacter));
  const chosen=selectedCharacter?getCharacterDef(selectedCharacter):null;
  const label=$("openingSelectedCharacter"); if(label)label.textContent=chosen?`使用キャラクター：${chosen.name}`:"キャラクターを選択してください";
}
async function chooseOpeningCharacter(id){
  if(id!=="random"){
    selectedCharacter=id;saveCharacter(id);renderOpeningCharacterGrid();renderCharacterGrid();return;
  }
  const pool=CHARACTER_DEFS.map(c=>c.id);let n=0;
  const timer=setInterval(()=>{
    selectedCharacter=pool[n%pool.length];renderOpeningCharacterGrid();n++;
    if(n>=12){clearInterval(timer);selectedCharacter=pool[Math.floor(Math.random()*pool.length)];saveCharacter(selectedCharacter);renderOpeningCharacterGrid();renderCharacterGrid();}
  },60);
}
function mountOpeningCharacterSelect(){
  const opening=$("openingMenu"); if(!opening||$("openingCharacterSelect"))return;
  selectedCharacter=loadCharacter()||"merchant";saveCharacter(selectedCharacter);
  const sec=document.createElement("div");sec.id="openingCharacterSelect";sec.className="openingCharacterSelect";
  sec.innerHTML=`<div class="openingCharacterTitle">CHARACTER SELECT</div><div class="openingCharacterLead">対戦に使用するキャラクターを選択してください　※性能差はありません</div><div id="openingCharacterGrid" class="characterGrid openingCharacterGrid"></div><div id="openingSelectedCharacter"></div>`;
  const anchor=opening.querySelector(".openingMenuActions"); if(anchor)opening.insertBefore(sec,anchor); else opening.appendChild(sec);
  renderOpeningCharacterGrid();
}

'''
          if 'function mountOpeningCharacterSelect()' not in s:
              s=s.replace(marker,opening_js+marker,1)

          s=s.replace('$("friendMatchBtn").onclick=()=>beginCharacterSelect("friend"); $("backOpening").onclick=showOpeningMenu; $("backCharacter").onclick=leaveCharacterSelect;',
                      '$("friendMatchBtn").onclick=()=>{pendingMatchMode="friend";if(!selectedCharacter){selectedCharacter=loadCharacter()||"merchant";saveCharacter(selectedCharacter);}showFriendMenu();}; $("backOpening").onclick=showOpeningMenu; $("backCharacter").onclick=leaveCharacterSelect;')
          s=s.replace('$("rankedMatchBtn").onclick=()=>{if(rankedSearching)return startRankedMatch();beginCharacterSelect("ranked")};',
                      '$("rankedMatchBtn").onclick=()=>{if(rankedSearching)return startRankedMatch();pendingMatchMode="ranked";if(!selectedCharacter){selectedCharacter=loadCharacter()||"merchant";saveCharacter(selectedCharacter);}startRankedMatch();};')
          s=s.replace('''initAccount();\nlet q=new URLSearchParams(location.search).get("room");\nif(q){\n  pendingInviteRoom=q.toUpperCase();\n  beginCharacterSelect("friend");\n}''',
                      '''initAccount();\nmountOpeningCharacterSelect();\nlet q=new URLSearchParams(location.search).get("room");\nif(q){\n  pendingInviteRoom=q.toUpperCase();\n  pendingMatchMode="friend";\n  const rs=$("rankedStatus");if(rs)rs.textContent="招待ルームがあります。キャラクターを選んで「フレンドマッチ」へ進んでください。";\n}''')

          p.write_text(s)
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          assert 'ONLINE v3.4' in s
          assert 'openingCharacterGrid' in s
          assert '/characters/${c.id}.png' in s
          for n in ['zombie','merchant','gunslinger','swordswoman','robot','dog','mage','doctor','random']:
            assert Path('public/characters/'+n+'.png').exists(), n
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S):
            if 'src=' not in attrs:scripts.append(body)
          Path('/tmp/v34.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/v34.js
      - name: Commit
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-v3-4-character-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add BID GRID v3.4 opening character art selector"
          git push
