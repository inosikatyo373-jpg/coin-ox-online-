name: Apply BID GRID v3.2.3 selection clarity
"on":
  push:
    paths:
      - '.github/workflows/ui-v3-2-3-selection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve selected cell clarity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()

          s=s.replace('<title>BID GRID ONLINE v3.2.2</title>','<title>BID GRID ONLINE v3.2.3</title>')
          s=s.replace('ONLINE v3.2.2 / 2本先取・最大3戦','ONLINE v3.2.3 / 2本先取・最大3戦')

          css=r'''
/* ===== BID GRID v3.2.3 : CELL SELECTION CLARITY ===== */
.boardStatusBanner{
  width:min(92vw,520px);margin:0 auto 10px;padding:10px 14px;border-radius:12px;
  text-align:center;font-size:13px;font-weight:1000;letter-spacing:.03em;
  border:1px solid #4c5d73;color:#dbe7f6;background:linear-gradient(180deg,#111c2b,#0b131f);
  box-shadow:inset 0 0 0 1px #0a0f17,0 5px 14px #0004;
}
.boardStatusBanner.selecting{border-color:#78b7ff;color:#bdddff;background:linear-gradient(180deg,#10243d,#0a1728);box-shadow:0 0 0 2px #78b7ff28,0 0 18px #4d9cff20,inset 0 0 14px #4d9cff10}
.boardStatusBanner.auctioning{border-color:#f1c45e;color:#ffe49b;background:linear-gradient(180deg,#302311,#171007);box-shadow:0 0 0 2px #f1c45e35,0 0 24px #e9ad362c,inset 0 0 18px #f1c45e10}
.boardStatusBanner.waiting{opacity:.72}
.cell.selectable{border:2px solid #6eb1ff!important;background:linear-gradient(180deg,#eaf4ff,#dcecff)!important;box-shadow:0 0 0 2px #6eb1ff55,0 0 16px #6eb1ff2e!important;transform:scale(1.015)}
.cell.selectable:hover,.cell.selectable:focus-visible{transform:scale(1.045);box-shadow:0 0 0 3px #88c1ff88,0 0 26px #6eb1ff55!important}
.cell.selectable::before{content:"選択可";position:absolute;top:6px;left:6px;z-index:3;padding:3px 7px;border-radius:999px;background:#1f5f9f;color:#eef7ff;font-size:10px;line-height:1.25;font-weight:1000;letter-spacing:.04em;box-shadow:0 2px 7px #0004}
.cell.auction{border:3px solid #f4c95f!important;background:linear-gradient(180deg,#fff3bd,#f8dea0)!important;transform:scale(1.055)!important;z-index:4!important;animation:auctionTargetPulse 1.2s ease-in-out infinite!important}
.cell.auction::before{content:"競売対象";position:absolute;top:6px;left:6px;z-index:5;padding:4px 8px;border-radius:999px;background:linear-gradient(180deg,#ffe38b,#cf9428);color:#2b1904;font-size:10px;line-height:1.2;font-weight:1000;letter-spacing:.04em;box-shadow:0 3px 9px #0005,0 0 10px #f5c85f40}
.cell.auction::after{content:"NOW BIDDING / 競売中"!important;left:7px!important;right:7px!important;bottom:7px!important;padding:3px 4px!important;background:linear-gradient(180deg,#e8ad3f,#a96a17)!important;color:#fff4cf!important;border:1px solid #ffe18a!important;letter-spacing:.04em;box-shadow:0 4px 10px #0005,0 0 14px #f0b54240!important}
@keyframes auctionTargetPulse{0%,100%{box-shadow:0 0 0 3px #f4c95f88,0 0 18px #e3a52e55,inset 0 0 18px #f4c95f18;filter:brightness(1)}50%{box-shadow:0 0 0 5px #ffe28db0,0 0 36px #f0b23388,inset 0 0 28px #fff1b92c;filter:brightness(1.08)}}
.playerActionStatus{margin-top:5px;min-height:16px;color:#90c5ff;font-size:9px;font-weight:1000;letter-spacing:.06em}
.playerActionStatus.active::before{content:"◆ ";font-size:8px}
@media(max-width:600px){.boardStatusBanner{width:min(94vw,430px);font-size:11px;padding:8px 9px;margin-bottom:7px}.cell.selectable::before,.cell.auction::before{top:3px;left:3px;font-size:8px;padding:2px 5px}.cell.auction::after{left:3px!important;right:3px!important;bottom:3px!important;font-size:9px!important;padding:2px!important}.playerActionStatus{font-size:8px;margin-top:3px;min-height:12px}}
@media (prefers-reduced-motion: reduce){.cell.auction{animation:none!important}}
'''
          if 'BID GRID v3.2.3 : CELL SELECTION CLARITY' not in s:
              s=s.replace('\n</style></head>',css+'\n</style></head>')

          old='<section class="panel"><div id="board" class="board"></div></section>'
          new='<section class="panel"><div id="boardStatus" class="boardStatusBanner waiting">対戦開始を待っています</div><div id="board" class="board"></div></section>'
          if old not in s: raise SystemExit('board section not found')
          s=s.replace(old,new,1)

          old_map='''$("players").innerHTML=ps.map((p,i)=>{\n  const role=state.first===i?"先手":state.first!==null?"後手":"";\n  const mark=i?"×":"〇";\n  const name=p?p.name:"待機中";\n  const rate=p?.account&&Number.isInteger(p?.rating)?`RATE ${p.rating}`:"RATE ----";\n  return `<div class="player ${i===slot?"you":""}">\n    <div class="playerIdentity">\n      <div class="playerNameRow"><span class="playerSymbol ${i?"p2":"p1"}">${mark}</span><span class="playerName ${i?"p2":"p1"}">${name}</span>${role?`<span class="role ${role==="先手"?"first":"second"}">${role}</span>`:""}</div>\n      <div class="playerRate">${rate}</div>\n    </div>\n    <div class="playerAvatar ${i?"avatarX":"avatarO"}" aria-hidden="true"><span class="avatarHat"></span><span class="avatarMark">${mark}</span></div>\n    <div class="playerCoinsWrap"><span class="playerCoinsValue">${state.coins[i]}</span><span class="playerCoinsUnit">枚</span></div>\n  </div>`;\n}).join("");'''
          new_map='''$("players").innerHTML=ps.map((p,i)=>{\n  const role=state.first===i?"先手":state.first!==null?"後手":"";\n  const mark=i?"×":"〇";\n  const name=p?p.name:"待機中";\n  const rate=p?.account&&Number.isInteger(p?.rating)?`RATE ${p.rating}`:"RATE ----";\n  const action=state.phase==="select"&&state.selector===i?"マス選択中":"";\n  return `<div class="player ${i===slot?"you":""}">\n    <div class="playerIdentity">\n      <div class="playerNameRow"><span class="playerSymbol ${i?"p2":"p1"}">${mark}</span><span class="playerName ${i?"p2":"p1"}">${name}</span>${role?`<span class="role ${role==="先手"?"first":"second"}">${role}</span>`:""}</div>\n      <div class="playerRate">${rate}</div>\n      <div class="playerActionStatus ${action?"active":""}">${action}</div>\n    </div>\n    <div class="playerAvatar ${i?"avatarX":"avatarO"}" aria-hidden="true"><span class="avatarHat"></span><span class="avatarMark">${mark}</span></div>\n    <div class="playerCoinsWrap"><span class="playerCoinsValue">${state.coins[i]}</span><span class="playerCoinsUnit">枚</span></div>\n  </div>`;\n}).join("");'''
          if old_map not in s: raise SystemExit('player map not found')
          s=s.replace(old_map,new_map,1)

          old_board='''$("surrenderRound").classList.toggle("hidden",!["select","bid","auctionPause"].includes(state.phase)||state.pausedForDisconnect);\nconst b=$("board");b.innerHTML="";state.board.forEach((v,i)=>{const x=document.createElement("button");x.className="cell";x.dataset.cellIndex=i;if(v===0){x.textContent="〇";x.classList.add("o")}if(v===1){x.textContent="×";x.classList.add("x")}if(i===4&&!state.middleUnlocked&&v===null){x.textContent="中央";x.classList.add("blocked")}if(state.phase==="bid"&&state.selected===i)x.classList.add("auction");x.disabled=!ps[1]||state.pausedForDisconnect||state.phase!=="select"||state.selector!==slot||v!==null||(i===4&&!state.middleUnlocked);x.onclick=()=>s.emit("select",{cell:i});b.appendChild(x)});'''
          new_board='''$("surrenderRound").classList.toggle("hidden",!["select","bid","auctionPause"].includes(state.phase)||state.pausedForDisconnect);\nconst boardStatus=$("boardStatus");\nif(boardStatus){\n  boardStatus.className="boardStatusBanner";\n  if(state.pausedForDisconnect){boardStatus.textContent="接続復帰を待っています";boardStatus.classList.add("waiting");}\n  else if(state.phase==="waiting"){boardStatus.textContent="対戦相手を待っています";boardStatus.classList.add("waiting");}\n  else if(state.phase==="select"){const mine=state.selector===slot;boardStatus.textContent=mine?"青く光るマスから、競売するマスを選択してください":`${ps[state.selector]?.name||"相手"} が競売するマスを選択中`;boardStatus.classList.add("selecting");}\n  else if(state.phase==="bid"&&state.selected!==null){boardStatus.textContent=`現在競売中：マス ${state.selected+1}`;boardStatus.classList.add("auctioning");}\n  else if(state.phase==="auctionPause"&&state.selected!==null){boardStatus.textContent=`競売結果を表示中：マス ${state.selected+1}`;boardStatus.classList.add("auctioning");}\n  else{boardStatus.textContent="対戦進行中";boardStatus.classList.add("waiting");}\n}\nconst b=$("board");b.innerHTML="";state.board.forEach((v,i)=>{const x=document.createElement("button");x.className="cell";x.dataset.cellIndex=i;if(v===0){x.textContent="〇";x.classList.add("o")}if(v===1){x.textContent="×";x.classList.add("x")}if(i===4&&!state.middleUnlocked&&v===null){x.textContent="中央";x.classList.add("blocked")}const selectable=!!ps[1]&&!state.pausedForDisconnect&&state.phase==="select"&&state.selector===slot&&v===null&&!(i===4&&!state.middleUnlocked);if(selectable)x.classList.add("selectable");if(state.phase==="bid"&&state.selected===i)x.classList.add("auction");x.disabled=!selectable;x.onclick=()=>s.emit("select",{cell:i});b.appendChild(x)});'''
          if old_board not in s: raise SystemExit('board render not found')
          s=s.replace(old_board,new_board,1)
          p.write_text(s)
          PY
      - name: Validate UI JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          assert 'ONLINE v3.2.3' in s
          assert 'id="boardStatus"' in s
          assert 'cell.selectable' in s
          assert '現在競売中：マス' in s
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S):
              if 'src=' not in attrs: scripts.append(body)
          Path('/tmp/bid-grid-v323.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/bid-grid-v323.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/ui-v3-2-3-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/ui-v3-2-3-selection.yml
          git commit -m "Improve BID GRID v3.2.3 selected cell clarity"
          git push
