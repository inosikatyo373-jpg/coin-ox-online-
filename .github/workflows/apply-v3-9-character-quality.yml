name: Apply BID GRID v3.9 character quality

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.9 patch
        run: python3 scripts/apply_v3_9.py
      - name: Validate
        run: |
          grep -q 'BID GRID ONLINE v3.9' public/index.html
          grep -q '/v39.css?v=390' public/index.html
          grep -q 'selectedCharacter=loadCharacter()||"gunslinger"' public/index.html
          grep -q 'CHARACTER_DEFS\[2\]' public/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-9-character-quality.yml scripts/apply_v3_9.py
          git add public/index.html public/v39.css
          git commit -m "Preserve character quality and default to Gunslinger"
          git push
