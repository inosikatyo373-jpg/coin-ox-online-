name: Apply BID GRID v3.5 gunslinger idle
on:
  push:
    paths:
      - '.github/workflows/apply-v3-5-gunslinger-idle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gunslinger idle frames
        run: |
          mkdir -p public/characters/gunslinger
          unzip -o .tmp/gunslinger-idle.zip -d public/characters/gunslinger
      - name: Patch BID GRID v3.5
        run: python .github/scripts/patch_v3_5_gunslinger_idle.py
      - name: Validate JavaScript
        run: node --check /tmp/bid-grid-v35-inline.js
      - name: Commit changes
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-v3-5-gunslinger-idle.yml .github/scripts/patch_v3_5_gunslinger_idle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add BID GRID v3.5 gunslinger battle motion"
          git push
