name: Apply BID GRID v3.2.2 UI refresh
on:
  push:
    paths:
      - '.github/workflows/ui-v3-2-2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: python .github/scripts/patch_v3_2_2.py
      - name: Validate JavaScript
        run: node --check /tmp/bid-grid-inline.js
      - name: Commit changes
        run: |
          rm -f .github/workflows/ui-v3-2-2.yml .github/scripts/patch_v3_2_2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/ui-v3-2-2.yml .github/scripts/patch_v3_2_2.py
          git commit -m "Polish BID GRID v3.2.2 opening and player cards"
          git push
