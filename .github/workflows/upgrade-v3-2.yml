name: Upgrade BID GRID v3.2
on:
  push:
    paths:
      - '.github/workflows/upgrade-v3-2.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v3.2 patch
        run: python tools/upgrade_v32.py
      - name: Validate JavaScript
        run: |
          node --check server/server.js
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const m=h.match(/<script src=\"\\/socket\\.io\\/socket\\.io\\.js\"><\\/script><script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('script not found');new Function(m[1]);console.log('client JS syntax OK')"
      - name: Commit v3.2
        run: |
          rm -f .github/workflows/upgrade-v3-2.yml tools/upgrade_v32.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade BID GRID to v3.2 ranked matchmaking"
          git push
