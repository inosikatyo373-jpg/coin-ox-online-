name: One-time BID GRID v3.1 upgrade

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.1 upgrade
        run: bash scripts/upgrade-v31.sh
