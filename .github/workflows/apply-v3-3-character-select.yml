name: Apply BID GRID v3.3 character selection
on:
  push:
    paths:
      - '.github/workflows/apply-v3-3-character-select.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch character selection
        run: python .github/scripts/patch_v3_3_character_select.py
      - name: Validate JavaScript and server
        run: |
          node --check /tmp/bid-grid-v33-inline.js
          node --check server/server.js
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-v3-3-character-select.yml .github/scripts/patch_v3_3_character_select.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html server/server.js .github/workflows/apply-v3-3-character-select.yml .github/scripts/patch_v3_3_character_select.py
          git commit -m "Add BID GRID v3.3 character select before matchmaking"
          git push
