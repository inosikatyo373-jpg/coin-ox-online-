name: Apply BID GRID v3.6 character UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename gunslinger idle assets
        shell: bash
        run: |
          set -e
          dir="public/characters/gunslinger"
          for i in 1 2 3 4; do
            old="$dir/idle-$i.png"
            new="$dir/gunslinger_idle_$i.png"
            if [ -f "$old" ] && [ ! -f "$new" ]; then
              git mv "$old" "$new"
            fi
          done

      - name: Patch UI
        run: python3 .github/patch-v3-6.py

      - name: Validate
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4; do
            test -s "public/characters/gunslinger/gunslinger_idle_$i.png"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/bidgrid-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert 'BID GRID ONLINE v3.6' in s
          assert 'gunslinger_idle_1.png' in s
          assert 'battleCharacterFaceMarkup' in s
          assert 'openingCharacterBanner' in s
          PY
          node --check /tmp/bidgrid-inline.js

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-6-character-ui.yml .github/patch-v3-6.py
          git add public/index.html public/characters/gunslinger
          git commit -m "Add BID GRID v3.6 character UI polish"
          git push
