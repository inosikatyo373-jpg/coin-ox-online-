name: Fix BID GRID v3.1 HUD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v311-hud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hud:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch fixed HUD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          old = '.stickyHud{position:sticky;top:0;z-index:12;background:#111827ee;backdrop-filter:blur(8px);border:2px solid #374151;border-radius:14px;padding:7px 10px;margin:8px 0;box-shadow:0 5px 18px #0007}'
          new = '.stickyHud{position:fixed;top:8px;left:50%;right:auto;width:min(calc(100vw - 24px),900px);transform:translateX(-50%);z-index:60;background:#111827ee;backdrop-filter:blur(8px);border:2px solid #374151;border-radius:14px;padding:7px 10px;margin:0;box-shadow:0 5px 18px #0007}'
          if old not in s:
              raise SystemExit('base stickyHud rule not found')
          s = s.replace(old, new, 1)

          old_mobile = '@media(max-width:600px){body{padding-top:88px}.stickyHud{position:fixed;top:0;left:0;right:0;margin:0;padding:7px 10px;border-radius:0 0 14px 14px;z-index:50}'
          new_mobile = '@media(max-width:600px){body{padding-top:88px}.stickyHud{position:fixed;top:0;left:0;right:0;width:100%;transform:none;margin:0;padding:7px 10px;border-radius:0 0 14px 14px;z-index:60}'
          if old_mobile not in s:
              raise SystemExit('mobile stickyHud rule not found')
          s = s.replace(old_mobile, new_mobile, 1)

          marker = '.hudBid{text-align:center;font-size:14px;font-weight:900;color:#e5e7eb;margin-top:2px}'
          if marker not in s:
              raise SystemExit('HUD marker not found')
          s = s.replace(marker, marker + '@media(min-width:601px){#game{padding-top:96px}}', 1)

          s = s.replace('BID GRID ONLINE v3.1', 'BID GRID ONLINE v3.1.1')
          s = s.replace('ONLINE v3.1 / 2本先取・最大3戦', 'ONLINE v3.1.1 / 2本先取・最大3戦')
          p.write_text(s, encoding='utf-8')

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['version'] = '3.1.1'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --check server/server.js
          grep -q 'position:fixed;top:8px;left:50%' public/index.html
          grep -q 'BID GRID ONLINE v3.1.1' public/index.html

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html package.json
          git rm .github/workflows/fix-v311-hud.yml
          git commit -m 'Fix HUD coins and timer at top during matches'
          git push
