name: Apply BID GRID v3.8 battle stage

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/apply_v3_8.py

      - name: Validate
        run: |
          grep -q 'BID GRID ONLINE v3.8' public/index.html
          grep -q '/v38.css?v=380' public/index.html
          grep -q '/v38.js?v=380' public/index.html
          for i in 1 2 3 4; do test -s "public/characters/gunslinger/gunslinger_idle_$i.png"; done
          node --check public/v38.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v3-8-battle-stage.yml scripts/apply_v3_8.py
          git add public/index.html public/v38.css public/v38.js
          git commit -m "Polish BID GRID v3.8 battle stage"
          git push
