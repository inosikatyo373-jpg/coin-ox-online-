<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コイン競売〇×ゲーム ONLINE v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:14px}h1{text-align:center}.muted{color:#9ca3af;text-align:center}.panel{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;gap:8px}.row>*{flex:1}input{padding:12px;border-radius:10px;border:2px solid #4b5563;background:#111827;color:#fff;font-size:18px;min-height:48px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#374151;color:#fff;min-height:48px;touch-action:manipulation}.primary{background:#2563eb}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:10px;background:#111827;border-radius:10px;border:2px solid #374151}.active{border-color:#fbbf24}.coins{font-size:24px;font-weight:900}.p1{color:#60a5fa}.p2{color:#f87171}.status{text-align:center;font-weight:800;font-size:18px}.timer{text-align:center;font-size:30px;color:#fbbf24;font-weight:900}.board{width:min(92vw,520px);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;background:#f3f4f6;color:#111827;font-size:clamp(42px,13vw,90px);padding:0;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,background .15s}.cell:disabled{cursor:default}.blocked{background:#374151;color:#9ca3af;font-size:15px}.o{color:#2563eb}.x{color:#dc2626}.cell.auction{background:#fff7cc;box-shadow:0 0 0 4px #f59e0b inset,0 0 18px #f59e0b;transform:scale(1.02);z-index:1}.cell.auction::after{content:"競売中";position:absolute;left:6px;right:6px;bottom:6px;background:#f59e0b;color:#111827;border-radius:7px;font-size:clamp(11px,2.5vw,14px);line-height:1.7;font-weight:900;box-shadow:0 2px 6px #0003}.log{max-height:180px;overflow:auto}.log div{padding:5px;border-bottom:1px solid #374151}.hidden{display:none!important}.code{font-size:30px;text-align:center;font-weight:900;letter-spacing:5px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{background:#1f2937;border-radius:18px;padding:25px;max-width:440px;width:100%;text-align:center}
@media(max-width:600px){.app{padding:8px}h1{font-size:25px;margin:8px 0 4px}.panel{padding:10px;margin:8px 0;border-radius:13px}.players{gap:6px}.player{padding:8px}.coins{font-size:21px}.status{font-size:16px;line-height:1.4}.timer{font-size:28px}.board{width:min(94vw,430px);gap:5px}.cell{border-radius:9px;font-size:clamp(38px,18vw,72px)}.cell.auction{box-shadow:0 0 0 3px #f59e0b inset,0 0 13px #f59e0b}.cell.auction::after{left:3px;right:3px;bottom:3px;padding:1px 0;font-size:11px;border-radius:5px}.row{gap:6px}.row button{padding:10px 8px;font-size:14px}#bidPanel{position:sticky;bottom:8px;z-index:5;box-shadow:0 -4px 18px #0006}#bid{min-width:0}}
</style></head><body><main class="app"><h1>コイン競売〇×ゲーム</h1><div class="muted">ONLINE v2 / ルームコード対戦</div>
<section id="lobby" class="panel"><h2>オンライン対戦</h2><input id="name" placeholder="名前（任意）"><div class="row" style="margin-top:8px"><button id="create" class="primary">ルームを作る</button><button id="join">ルームに入る</button></div><input id="room" class="hidden" placeholder="ルームコード" style="margin-top:8px"><p id="lobbyMsg" class="muted"></p></section>
<section id="game" class="hidden"><section class="panel"><div>ルームコード</div><div id="code" class="code"></div><div id="players" class="players"></div></section><section class="panel"><div id="status" class="status"></div><div id="auctionInfo" class="muted"></div><div id="timer" class="timer">--</div></section><section class="panel"><div id="board" class="board"></div></section><section id="bidPanel" class="panel hidden"><h3>入札</h3><p class="muted">金額を入力して確定してください。相手には見えません。</p><div class="row"><input id="bid" type="number" min="0" placeholder="入札枚数"><button id="sendBid" class="primary">入札する</button></div><p id="bidMsg" class="muted"></p></section><section class="panel"><b>競売履歴</b><div id="log" class="log"></div></section></section>
<div id="modal" class="modal hidden"><div><h2 id="result"></h2><p id="resultText"></p><button onclick="location.reload()" class="primary">ロビーに戻る</button></div></div></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();let slot=null,room=null,state=null;const $=x=>document.getElementById(x);
$("create").onclick=()=>s.emit("create",{name:$("name").value},handle);$("join").onclick=()=>{const r=$("room");if(r.classList.contains("hidden")){r.classList.remove("hidden");return}if(r.value)s.emit("join",{room:r.value,name:$("name").value},handle)};
function handle(r){if(!r.ok)return $("lobbyMsg").textContent=r.error;slot=r.slot;room=r.room;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=room;history.replaceState(null,"","?room="+room);if(slot===0)navigator.clipboard?.writeText(location.href).catch(()=>{})}
s.on("state",x=>{state=x;render()});s.on("tick",t=>$("timer").textContent=t+"秒");s.on("log",m=>$("log").insertAdjacentHTML("afterbegin","<div>"+m+"</div>"));s.on("selected",x=>{$("bidPanel").classList.remove("hidden");$("bidMsg").textContent="マス"+(x.cell+1)+"を競売中"});s.on("bidAccepted",()=>{$("bidMsg").textContent="入札を受け付けました。相手を待っています。";$("sendBid").disabled=true});s.on("errorMsg",m=>alert(m));s.on("playerDisconnected",()=>{$("status").textContent="相手が切断しました。"});
s.on("result",r=>{$("result").textContent=r.winner===0?"〇の勝利！":r.winner===1?"×の勝利！":"引き分け";$("resultText").textContent=`最終コイン：〇 ${r.coins[0]}枚 / × ${r.coins[1]}枚`;$("modal").classList.remove("hidden")});
function render(){if(!state)return;const ps=state.players;$("players").innerHTML=ps.map((p,i)=>`<div class="player ${i===slot?"active":""}"><span class="${i?"p2":"p1"}">${i?"×":"〇"} ${p?p.name:"待機中"}</span><div class="coins">${state.coins[i]}枚</div></div>`).join("");$("status").textContent=!ps[1]?"友達の参加を待っています…":state.phase==="select"?(state.selector===slot?"あなた":"相手")+"が競売マスを選択":state.phase==="bid"?"入札受付中":"対戦中";const b=$("board");b.innerHTML="";state.board.forEach((v,i)=>{const x=document.createElement("button");x.className="cell";if(v===0){x.textContent="〇";x.classList.add("o")}if(v===1){x.textContent="×";x.classList.add("x")}if(i===4&&!state.middleUnlocked&&v===null){x.textContent="中央";x.classList.add("blocked")}if(state.phase==="bid"&&state.selected===i)x.classList.add("auction");x.disabled=!ps[1]||state.phase!=="select"||state.selector!==slot||v!==null||(i===4&&!state.middleUnlocked);x.onclick=()=>s.emit("select",{cell:i});b.appendChild(x)});$("bidPanel").classList.toggle("hidden",state.phase!=="bid");if(state.phase!=="bid"){$("sendBid").disabled=false;$("bid").value=""}$("auctionInfo").textContent=state.phase==="bid"&&state.selected!==null?"マス"+(state.selected+1)+"が現在の競売対象です":" ";$("timer").textContent=state.timeLeft+"秒"}
let q=new URLSearchParams(location.search).get("room");if(q){$("room").classList.remove("hidden");$("room").value=q.toUpperCase()}$("sendBid").onclick=()=>{const n=Number($("bid").value);if(Number.isInteger(n)&&n>=0)s.emit("bid",{amount:n})};
</script></body></html>
