<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コイン競売〇×ゲーム ONLINE v2.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:12px}h1{text-align:center;font-size:28px;margin:8px 0 2px}.muted{color:#9ca3af;text-align:center}
.stickyHud{position:sticky;top:0;z-index:12;background:#111827ee;backdrop-filter:blur(8px);border:2px solid #374151;border-radius:14px;padding:7px 10px;margin:8px 0;box-shadow:0 5px 18px #0007}
.hudRound{text-align:center;font-size:13px;font-weight:900;color:#fbbf24}
.hudMain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hudPlayer{font-size:18px;font-weight:900}
.hudPlayer:last-child{text-align:right}
.hudTimer{font-size:32px;font-weight:1000;color:#fbbf24;text-align:center;min-width:92px}
.hudBid{text-align:center;font-size:14px;font-weight:900;color:#e5e7eb;margin-top:2px}
.bidLimit{font-size:18px;font-weight:900;color:#fbbf24;margin:5px 0;text-align:center}.panel{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}input{padding:12px;border-radius:10px;border:2px solid #4b5563;background:#111827;color:#fff;font-size:18px;min-height:48px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#374151;color:#fff;min-height:48px;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#2563eb}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{padding:10px;background:#111827;border-radius:10px;border:2px solid #374151}.you{border-color:#fbbf24}.coins{font-size:24px;font-weight:900}.p1{color:#60a5fa}.p2{color:#f87171}.role{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:999px;background:#374151;font-size:12px;font-weight:900}.role.first{background:#fbbf24;color:#111827}.role.second{background:#6b7280;color:#fff}.score{font-size:15px;margin-top:3px}.status{text-align:center;font-weight:900;font-size:19px;line-height:1.4}.turnBox{margin:7px auto 0;max-width:560px;padding:10px 12px;border-radius:12px;text-align:center;font-weight:900;background:#111827;border:2px solid #4b5563}.turnBox.myTurn{border-color:#22c55e;background:#052e16}.turnBox.opponentTurn{border-color:#ef4444;background:#450a0a}.timerRow{display:flex;align-items:center;justify-content:center;gap:18px}.timer{font-size:32px;color:#fbbf24;font-weight:900;min-width:88px;text-align:center}.diamonds{display:flex;gap:6px;font-size:25px;min-width:80px}.diamonds.left{justify-content:flex-end}.diamonds.right{justify-content:flex-start}.diamond{opacity:.3;filter:grayscale(1);transition:.2s}.diamond.lit{opacity:1;filter:none;text-shadow:0 0 7px #67e8f9,0 0 16px #22d3ee;transform:scale(1.08)}.scoreLine{text-align:center;font-weight:900;margin-top:2px}.board{width:min(92vw,520px);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;background:#f3f4f6;color:#111827;font-size:clamp(42px,13vw,90px);padding:0;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,background .15s}.blocked{background:#374151;color:#9ca3af;font-size:15px}.o{color:#2563eb}.x{color:#dc2626}.cell.auction{background:#fff7cc;box-shadow:0 0 0 4px #f59e0b inset,0 0 18px #f59e0b;transform:scale(1.02);z-index:1}@keyframes auctionPulse{0%,100%{box-shadow:0 0 0 3px #f59e0b inset,0 0 8px #f59e0b66;background:#fff7cc}50%{box-shadow:0 0 0 4px #f59e0b inset,0 0 18px #f59e0b99;background:#fff2b3}}
.cell.auction{animation:auctionPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.cell.auction{animation:none}}
.cell.auction::after{content:"競売中";position:absolute;left:6px;right:6px;bottom:6px;background:#f59e0b;color:#111827;border-radius:7px;font-size:clamp(11px,2.5vw,14px);line-height:1.7;font-weight:900;box-shadow:0 2px 6px #0003}.bidTarget{text-align:center;font-weight:900;margin:0 0 8px;color:#fbbf24}.log{max-height:180px;overflow:auto}.log div{padding:5px;border-bottom:1px solid #374151}.hidden{display:none!important}.code{font-size:30px;text-align:center;font-weight:900;letter-spacing:5px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal>div{background:#1f2937;border-radius:18px;padding:24px;max-width:460px;width:100%;text-align:center}.modal .choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.resultBig{font-size:30px;font-weight:1000}.matchScore{font-size:22px;font-weight:900}.waitChoice{color:#fbbf24;font-weight:900}
@media(max-width:600px){body{padding-top:88px}.stickyHud{position:fixed;top:0;left:0;right:0;margin:0;padding:7px 10px;border-radius:0 0 14px 14px;z-index:50}.hudPlayer{font-size:15px}.hudTimer{font-size:27px;min-width:70px}.hudBid{font-size:12px}.app{padding:8px}h1{font-size:24px}.panel{padding:10px;margin:8px 0;border-radius:13px}.player{padding:8px}.coins{font-size:21px}.status{font-size:16px}.timer{font-size:28px;min-width:70px}.timerRow{gap:8px}.diamonds{font-size:21px;min-width:70px;gap:4px}.board{width:min(94vw,430px);gap:5px}.cell{border-radius:9px;font-size:clamp(38px,18vw,72px)}.cell.auction{box-shadow:0 0 0 3px #f59e0b inset,0 0 13px #f59e0b}.cell.auction::after{left:3px;right:3px;bottom:3px;padding:1px 0;font-size:11px;border-radius:5px}.row{gap:6px}.row button{padding:10px 8px;font-size:14px}#bidPanel{position:sticky;bottom:8px;z-index:5;box-shadow:0 -4px 18px #0006}#bid{min-width:0}.modal .choiceRow{grid-template-columns:1fr}}
</style></head><body><main class="app"><h1>コイン競売〇×ゲーム</h1><div class="muted">ONLINE v2.2 / 2本先取・最大3戦</div>
<section id="lobby" class="panel"><h2>オンライン対戦</h2><input id="name" placeholder="名前（任意）"><div class="row" style="margin-top:8px"><button id="create" class="primary">ルームを作る</button><button id="join">ルームに入る</button></div><input id="room" class="hidden" placeholder="ルームコード" style="margin-top:8px"><p id="lobbyMsg" class="muted"></p></section>
<section id="game" class="hidden">
<div id="stickyHud" class="stickyHud">
  <div class="hudRound" id="hudRound">待機中</div>
  <div class="hudMain">
    <div class="hudPlayer">〇 <b id="hudCoins0">--</b>枚</div>
    <div class="hudTimer" id="hudTimer">--</div>
    <div class="hudPlayer">× <b id="hudCoins1">--</b>枚</div>
  </div>
  <div class="hudBid" id="hudBid">入札額は相手には表示されません</div>
</div><section class="panel"><div>ルームコード</div><div id="code" class="code"></div><div id="players" class="players"></div></section>
<section class="panel"><div id="roundLabel" class="status"></div><div id="roleLabel" class="muted"></div><div id="turnBox" class="turnBox"></div><div class="timerRow"><div id="diamondsLeft" class="diamonds left"></div><div id="timer" class="timer">--</div><div id="diamondsRight" class="diamonds right"></div></div><div id="scoreLine" class="scoreLine"></div></section>
<section class="panel"><div id="board" class="board"></div></section>
<section id="bidPanel" class="panel hidden"><div id="bidTarget" class="bidTarget"></div><div id="bidLimit" class="bidLimit"></div><p class="muted">入札額は所持コイン以内です。時間切れ時は最後に入力していた金額を自動入札します。</p><div class="row"><input id="bid" type="number" min="0" placeholder="入札枚数"><button id="sendBid" class="primary">入札する</button></div><p id="bidMsg" class="muted"></p></section>
<section class="panel"><b>競売履歴</b><div id="log" class="log"></div></section></section>
<div id="modal" class="modal hidden"><div><div id="resultBig" class="resultBig"></div><p id="resultText"></p><div id="matchActions"></div></div></div>
<div id="auctionOverlay" class="modal hidden">
  <div>
    <div id="auctionResultText" class="resultBig"></div>
    <p class="muted">2秒後に次のターンへ進みます</p>
  </div>
</div>

<div id="countdownOverlay" class="modal hidden">
  <div>
    <div class="muted" id="countdownRound">次の戦</div>
    <div id="countdownNum" class="resultBig" style="font-size:72px">5</div>
    <p class="muted">両プレイヤー準備完了</p>
  </div>
</div>

</main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();let slot=null,room=null,state=null;const $=x=>document.getElementById(x);
$("create").onclick=()=>s.emit("create",{name:$("name").value},handle);$("join").onclick=()=>{const r=$("room");if(r.classList.contains("hidden")){r.classList.remove("hidden");return}if(r.value)s.emit("join",{room:r.value,name:$("name").value},handle)};
function handle(r){if(!r.ok)return $("lobbyMsg").textContent=r.error;slot=r.slot;room=r.room;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=room;history.replaceState(null,"","?room="+room);if(slot===0)navigator.clipboard?.writeText(location.href).catch(()=>{})}
s.on("state",x=>{state=x;render()});s.on("tick",t=>{$("timer").textContent=t+"秒";$("hudTimer").textContent=t+"秒";});s.on("log",m=>$("log").insertAdjacentHTML("afterbegin","<div>"+m+"</div>"));s.on("selected",x=>{$("bidPanel").classList.remove("hidden");$("bidTarget").textContent="現在の競売対象：マス"+(x.cell+1);$("bidMsg").textContent=x.auto?"選択時間切れのため自動選択されました。":"入札額を決めてください。"});
s.on("auctionResult",r=>{
  const msg=r.winner===0
    ? `〇が${r.bids[0]}枚で獲得！`
    : r.winner===1
      ? `×が${r.bids[1]}枚で獲得！`
      : `同額 ${r.bids[0]}枚！`;
  $("auctionResultText").textContent=msg;
  $("auctionOverlay").classList.remove("hidden");
  setTimeout(()=>$("auctionOverlay").classList.add("hidden"),2000);
});

s.on("countdownStart",r=>{
  $("modal").classList.add("hidden");
  $("countdownOverlay").classList.remove("hidden");
  $("countdownNum").textContent=r.seconds||5;
});
s.on("countdownTick",n=>{
  $("countdownOverlay").classList.remove("hidden");
  $("countdownNum").textContent=n;
});

s.on("bidAccepted",()=>{$("bidMsg").textContent="入札を受け付けました。相手を待っています。";$("sendBid").disabled=true});s.on("errorMsg",m=>alert(m));s.on("playerDisconnected",()=>$("turnBox").textContent="相手が切断しました。");
s.on("roundResult",r=>showRoundResult(r));
function showRoundResult(r){$("resultBig").textContent=r.winner===0?"〇の勝利！":r.winner===1?"×の勝利！":"引き分け";$("resultText").innerHTML=`第${r.roundNumber}戦の結果<br>残りコイン：〇 ${r.coins[0]}枚 / × ${r.coins[1]}枚<br><span class="matchScore">現在の戦績　〇 ${r.matchWins[0]}勝 - ${r.matchWins[1]}勝 ×</span>`;if(r.matchWinner!==null)showMatchEnd(r.matchWinner,r.matchWins);else $("matchActions").innerHTML=`<p>次の第${r.roundNumber+1}戦へ進みます。</p><button class="primary" onclick="goNextRound()">次の戦へ</button>`;$("modal").classList.remove("hidden")}
function showMatchEnd(w,wins){const name=state?.players?.[w]?.name||(w===0?"〇":"×");$("resultBig").textContent=`${name} の勝利！`;$("resultText").innerHTML=`2本先取で対戦終了<br><span class="matchScore">〇 ${wins[0]}勝 - ${wins[1]}勝 ×</span>`;$("matchActions").innerHTML=`<p class="waitChoice">どちらに進むか選択してください。</p><div class="choiceRow"><button class="primary" onclick="chooseMatch('rematch')">連戦する</button><button onclick="chooseMatch('room')">ルームに戻る</button></div>`}
function goNextRound(){
  s.emit("nextRound");
  $("matchActions").innerHTML=`<p class="waitChoice">あなた：準備OK ✅<br>相手：準備待ち…</p>`;
}

function chooseMatch(c){s.emit("matchChoice",{choice:c});$("matchActions").innerHTML=`<p class="waitChoice">相手の選択を待っています…</p>`}
function diamonds(w){let h="";for(let i=0;i<2;i++)h+=`<span class="diamond ${i<w?"lit":""}">♦</span>`;return h}
function render(){if(!state)return;
  // 通常ゲーム進行に戻ったら、結果/連戦ポップアップを必ず閉じる
  if(!["roundEnd","matchEnd"].includes(state.phase)){
    $("modal").classList.add("hidden");
  }

  if(state.phase!=="countdown") $("countdownOverlay").classList.add("hidden");

  $("hudCoins0").textContent=state.coins[0];
  $("hudCoins1").textContent=state.coins[1];
  $("hudRound").textContent=state.phase==="waiting"?"対戦相手を待っています":`第${state.roundNumber}戦 / 2本先取`;
  $("hudTimer").textContent=(state.phase==="waiting"||state.phase==="countdown"||state.phase==="auctionPause")?"--":state.timeLeft+"秒";
  if(state.phase==="bid"&&slot!==null){
    const current=$("bid").value||0;
    $("hudBid").textContent=`あなたの入力中：${current}枚 / 最大 ${state.coins[slot]}枚`;
  }else{
    $("hudBid").textContent="入札額は相手には表示されません";
  }
  updateBidLimit();const ps=state.players;$("players").innerHTML=ps.map((p,i)=>{const role=state.first===i?"先手":state.first!==null?"後手":"";return `<div class="player ${i===slot?"you":""}"><span class="${i?"p2":"p1"}">${i?"×":"〇"} ${p?p.name:"待機中"}</span>${role?`<div class="role ${role==="先手"?"first":"second"}">${role}</div>`:""}<div class="coins">${state.coins[i]}枚</div><div class="score">戦績：${state.matchWins[i]}勝</div></div>`}).join("");
$("roundLabel").textContent=state.phase==="waiting"?"対戦相手を待っています":`第${state.roundNumber}戦 / 2本先取`;
if(state.phase==="waiting"){$("roleLabel").textContent="相手が入室するまで先手・後手もタイマーも開始しません。";$("turnBox").textContent="待機中";$("turnBox").className="turnBox"}else if(state.phase==="countdown"){
    $("roleLabel").textContent="両プレイヤー準備完了";
    $("turnBox").textContent=`開始まで ${state.countdownLeft||5} 秒`;
    $("turnBox").className="turnBox";
  }else if(state.phase==="auctionPause"){
    $("roleLabel").textContent=`あなたは ${state.first===slot?"先手":"後手"} です`;
    $("turnBox").textContent="競売結果を表示中";
    $("turnBox").className="turnBox";
  }else if(state.phase==="select"){$("roleLabel").textContent=`あなたは ${state.first===slot?"先手":"後手"} です`;const mine=state.selector===slot;$("turnBox").textContent=mine?"あなたの手番：競売するマスを選択してください":"相手の手番：競売するマスを選択中";$("turnBox").className="turnBox "+(mine?"myTurn":"opponentTurn")}else if(state.phase==="bid"){$("roleLabel").textContent=`あなたは ${state.first===slot?"先手":"後手"} です`;$("turnBox").textContent="現在の手番：両者が同時入札中";$("turnBox").className="turnBox myTurn"}else{$("roleLabel").textContent=state.first!==null?`あなたは ${state.first===slot?"先手":"後手"} です`:"";$("turnBox").textContent="対戦結果を確認してください";$("turnBox").className="turnBox"}
$("diamondsLeft").innerHTML=diamonds(state.matchWins[0]);$("diamondsRight").innerHTML=diamonds(state.matchWins[1]);$("scoreLine").textContent=`〇 ${state.matchWins[0]}勝　｜　× ${state.matchWins[1]}勝`;
const b=$("board");b.innerHTML="";state.board.forEach((v,i)=>{const x=document.createElement("button");x.className="cell";if(v===0){x.textContent="〇";x.classList.add("o")}if(v===1){x.textContent="×";x.classList.add("x")}if(i===4&&!state.middleUnlocked&&v===null){x.textContent="中央";x.classList.add("blocked")}if(state.phase==="bid"&&state.selected===i)x.classList.add("auction");x.disabled=!ps[1]||state.phase!=="select"||state.selector!==slot||v!==null||(i===4&&!state.middleUnlocked);x.onclick=()=>s.emit("select",{cell:i});b.appendChild(x)});
$("bidPanel").classList.toggle("hidden",state.phase!=="bid");if(state.phase!=="bid"){$("sendBid").disabled=false;$("bid").value=""}$("bidTarget").textContent=state.phase==="bid"&&state.selected!==null?"現在の競売対象：マス"+(state.selected+1):"";$("timer").textContent=(state.phase==="waiting"||state.phase==="countdown"||state.phase==="auctionPause")?"--":state.timeLeft+"秒";
if(state.phase==="matchEnd"){$("modal").classList.remove("hidden");showMatchEnd(state.matchWinner,state.matchWins)}if(state.phase==="waiting")$("modal").classList.add("hidden")}
function updateBidLimit(){
  if(!state || slot===null || state.phase!=="bid"){
    if($("bidLimit"))$("bidLimit").textContent="";
    return;
  }
  const max=state.coins[slot]??0;
  $("bid").max=max;
  if($("bidLimit"))$("bidLimit").textContent=`入札可能額：0〜${max}枚（所持金 ${max}枚）`;
}

$("bid").addEventListener("input",()=>{
  if(!state || slot===null || state.phase!=="bid") return;
  let n=Number($("bid").value);
  if(!Number.isInteger(n) || n<0) n=0;
  const max=state.coins[slot]??0;
  if(n>max){ n=max; $("bid").value=n; }
  s.emit("bidDraft",{amount:n});
  if($("hudBid"))$("hudBid").textContent=`あなたの入力中：${n}枚 / 最大 ${max}枚`;
});

$("sendBid").onclick=()=>{
  const n=Number($("bid").value);
  const max=state?.coins?.[slot]??0;
  if(Number.isInteger(n)&&n>=0&&n<=max)s.emit("bid",{amount:n});
};let q=new URLSearchParams(location.search).get("room");if(q){$("room").classList.remove("hidden");$("room").value=q.toUpperCase()}
</script></body></html>
